<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
</head>
<body>
    <h1>Add Product</h1>
    <form method="post">
        {% csrf_token %}
        <p>
            {{ form.name.label_tag }}<br>
            {{ form.name }}
        </p>
        <p>
            {{ form.price.label_tag }}<br>
            {{ form.price }}
        </p>
        <p>
            {{ form.description.label_tag }}<br>
            {{ form.description }}
        </p>
        <p>
            {{ form.category.label_tag }}<br>
            {{ form.category }}
        </p>
        <button type="submit">Add Product</button>
    </form>

    <p><a href="{% url 'product_list' %}">Back to Product List</a></p>
</body>
</html>
